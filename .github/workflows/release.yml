name: release

# Publishes a Release for the feed, after proving the feed describes the bytes it points at.
#
# == WHY THE ARTIFACTS ARE NOT BUILT HERE =========================================================
#
# The Android heads are classic Xamarin, which is out of support and is not present on any
# GitHub-hosted runner image. Compilation therefore stays local. What CI can do reliably it does do.
# It re-derives every checksum from the real bytes and refuses to publish if the manifest disagrees,
# so a typed checksum fails here rather than reaching a node.
#
# == WHERE THE BYTES COME FROM, AND WHY THIS CHANGED ==============================================
#
# This repository is an INDEX. It holds no artifacts. Every row points at a release in another
# repository or at nuget.org, which is what artifact.url records.
#
# This job used to download the assets attached to THIS repository's release and require every
# manifest fileName to be among them. That could never pass. All five artifacts live elsewhere, so
# the only way to satisfy it was to re-upload roughly 150 MB of duplicates here and create a second
# copy of every artifact that could then disagree with the first. The repository has no tags, so the
# workflow had never run and the contradiction went unnoticed.
#
# It now fetches each artifact from its own artifact.url and verifies it there. That is a stronger
# check than the original, because it proves the URL a node will actually resolve serves the bytes
# the manifest promises, rather than proving something about a private copy.
#
# It also verifies the contains[] entries by opening each archive and hashing the named file inside.
# Those digests are not decoration. The landing page shows contains[0] beside the download button,
# so a wrong value there is a checksum a visitor is invited to fail.
#
# == THE EXPECTED SEQUENCE ========================================================================
#
#   1. Build locally, publish the artifacts to their own repositories' releases.
#   2. Update manifest.json with the new URLs, sizes and digests, and land it on main.
#   3. Create a DRAFT Release here for the tag, carrying the notes.
#   4. Push the tag. This workflow verifies the feed against the published bytes and publishes.
#
# The draft still has to exist first, because it is where the human-written notes live. A tag with
# no draft, a draft with no notes, or a release that is already public is a mistake rather than
# something to publish, so each is refused before the gate runs and before anything changes.
#
# == THE WRITTEN OFFER ============================================================================
#
# Distributing AGPL binaries obliges the distributor to offer the corresponding source for those
# exact binaries. That source is NOT this repository. This repository is a JSON index, and its
# commit says nothing about how any binary was built. The offer therefore names the source
# repository for each kind. Getting this wrong is a licence defect, not a cosmetic one, which is why
# it is produced by the workflow instead of left to whoever is cutting the release to remember.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # Never cancel a publish in flight.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: verify + publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: client-dist-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and check the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Expected vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate the manifest
        run: python3 tools/validate_manifest.py manifest.json

      # Three things are required of the release here, and each is checked rather than assumed.
      # It exists. It is still a DRAFT. It carries non-empty notes. This step used to fetch isDraft
      # and never read it, so an already-public release satisfied "require a draft" and the Publish
      # step re-published it with the written offer appended a second time. The body is fetched
      # once, here, before the gate, so an empty one fails while everything is still reversible
      # instead of flowing silently into the published notes.
      - name: Require a draft release carrying notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json isDraft --jq .isDraft > is_draft.txt 2>/dev/null; then
            echo "::error::No Release exists for $TAG. Create a DRAFT release for this tag, carrying"
            echo "::error::the release notes, before pushing the tag."
            exit 1
          fi
          if [ "$(cat is_draft.txt)" != "true" ]; then
            echo "::error::The Release for $TAG is already published. This workflow publishes a draft"
            echo "::error::exactly once. Re-running it against a public release would append the"
            echo "::error::written offer a second time. Nothing was changed."
            exit 1
          fi
          gh release view "$TAG" --json body --jq .body > body.md
          if ! grep -q '[^[:space:]]' body.md; then
            echo "::error::The draft Release for $TAG has no notes. The notes are the one part of a"
            echo "::error::release a person writes, and publishing without them is a mistake rather"
            echo "::error::than something to publish empty. Add them to the draft and push the tag again."
            exit 1
          fi
          # No assets are expected here. The artifacts live in the repositories that built them and
          # are verified at their published URLs by the next step.
          echo "draft present for $TAG with $(wc -c < body.md) bytes of notes"

      # THE GATE. Everything above is reversible. Publishing is not.
      - name: Verify every manifest artifact at its published URL
        shell: bash
        run: python3 tools/verify_published.py manifest.json

      - name: Compose the written offer of corresponding source
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Derived from the manifest rather than hardcoded, so the offer names what this release
          # actually carries. The corresponding source is NOT this repository. This repository is a
          # JSON index and its commit says nothing about how any binary was built, so naming it
          # would make the offer point at source that does not correspond to the artifacts.
          python3 - "$TAG" > offer.md <<'PY'
          import json, sys, urllib.parse

          # Which repository holds the source for each kind. Kept here rather than in the feed
          # because it describes provenance, which is not something a consuming node needs.
          SOURCE = {
              100: "Febris-XR/Febris_PC",
              200: "Febris-XR/Febris_MobileSuite",
              300: "Febris-XR/Febris_MobileSuite",
              400: "Febris-XR/Febris_SDK",
              500: "Febris-XR/Febris_SDK",
          }

          tag = sys.argv[1]
          manifest = json.load(open("manifest.json", encoding="utf-8"))

          print("")
          print("---")
          print("")
          print("## Written offer of corresponding source")
          print("")
          print("Every artifact this feed points at is licensed under AGPL-3.0-only. The")
          print("corresponding source for each one is the repository that built and published it,")
          print("at the tag named beside it below. This index repository is not that source.")
          print("")
          for pkg in manifest.get("packages", []):
              if pkg.get("obsolete"):
                  continue
              repo = SOURCE.get(pkg.get("kindId"), "unknown")
              url = (pkg.get("artifact") or {}).get("url", "")
              # A GitHub release URL carries its tag. Anything else, such as nuget.org, does not,
              # so fall back to the row's own version, which is what was published.
              parts = urllib.parse.urlparse(url).path.split("/")
              src_tag = parts[parts.index("download") + 1] if "download" in parts else "v" + pkg.get("version", "?")
              print("    %-28s %s @ %s" % (pkg.get("name", "?"), repo, src_tag))
          print("")
          print("    feed release: %s" % tag)
          print("")
          print("If the source for any of those tags is not reachable to you, open an issue on this")
          print("repository and it will be provided. This offer is valid for as long as this release")
          print("is distributed.")
          PY
          cat offer.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # body.md was fetched and checked non-empty before the gate. offer.md was composed from
          # the manifest. Neither is re-fetched here and nothing is allowed to be empty, because the
          # notes about to become public are the one output of this workflow a person reads.
          for f in body.md offer.md; do
            if ! grep -q '[^[:space:]]' "$f"; then
              echo "::error::$f is empty at publish time. Refusing to publish $TAG with incomplete notes."
              exit 1
            fi
          done
          cat body.md offer.md > notes.md
          gh release edit "$TAG" --draft=false --notes-file notes.md
          echo "published $TAG"
